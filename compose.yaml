services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rpy
      POSTGRES_USER: rpy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting a new local database}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpy -d rpy"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rpy_pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["python", "scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://rpy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rpy
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &rpy-env
      DATABASE_URL: postgresql://rpy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rpy
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      JUDIT_WEBHOOK_TOKEN: ${JUDIT_WEBHOOK_TOKEN:-dev-webhook-token}
      JUDIT_WEBHOOK_MAX_BODY_BYTES: ${JUDIT_WEBHOOK_MAX_BODY_BYTES:-5242880}
      JUDIT_WEBHOOK_TENANT_ID: ${JUDIT_WEBHOOK_TENANT_ID:-}
      RPY_TENANT_PROCESSES: ${RPY_TENANT_PROCESSES:-{}}
      RPY_BEARER_TOKENS: ${RPY_BEARER_TOKENS:-{}}
      RPY_OPS_TOKEN: ${RPY_OPS_TOKEN:-dev-ops-token}
      RETENTION_DAYS: ${RETENTION_DAYS:-365}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-30}
      DATAJUD_ENABLED: ${DATAJUD_ENABLED:-false}
      DATAJUD_AUTHORIZED_USE: ${DATAJUD_AUTHORIZED_USE:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  worker-1:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *rpy-env
      JUDIT_API_KEY: ${JUDIT_API_KEY:-}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      DATAJUD_BASE_URL: ${DATAJUD_BASE_URL:-https://api-publica.datajud.cnj.jus.br}
      DATAJUD_TIMEOUT_SECONDS: ${DATAJUD_TIMEOUT_SECONDS:-20}
      JUDIT_TIMEOUT_SECONDS: ${JUDIT_TIMEOUT_SECONDS:-15}
      JUDIT_CALLBACK_URL: ${JUDIT_CALLBACK_URL:-}
      JUDIT_ATTACHMENTS_ENABLED: ${JUDIT_ATTACHMENTS_ENABLED:-false}
      JUDIT_ATTACHMENT_DOWNLOAD_MODE: ${JUDIT_ATTACHMENT_DOWNLOAD_MODE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-2:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *rpy-env
      JUDIT_API_KEY: ${JUDIT_API_KEY:-}
      DATAJUD_API_KEY: ${DATAJUD_API_KEY:-}
      DATAJUD_BASE_URL: ${DATAJUD_BASE_URL:-https://api-publica.datajud.cnj.jus.br}
      DATAJUD_TIMEOUT_SECONDS: ${DATAJUD_TIMEOUT_SECONDS:-20}
      JUDIT_CALLBACK_URL: ${JUDIT_CALLBACK_URL:-}
      JUDIT_TIMEOUT_SECONDS: ${JUDIT_TIMEOUT_SECONDS:-15}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    environment: *rpy-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  demo-seed:
    profiles: ["demo"]
    build: .
    command: ["python", "scripts/seed_local_demo.py"]
    environment:
      DATABASE_URL: postgresql://rpy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rpy
      RPY_BEARER_TOKENS: ${RPY_BEARER_TOKENS:-{}}
      RPY_DEMO_BEARER_TOKEN: ${RPY_DEMO_BEARER_TOKEN:-dev-local-token}
      JUDIT_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  rpy_pgdata:
